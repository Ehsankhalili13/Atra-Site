{% extends "general/english/base.html" %}

{% block head %}
    <link rel="stylesheet" href="{{url_for('static', filename='css/general/product.css')}}">
{% endblock %}

{% block title %}
    {{ p.product_name_en }}
{% endblock %}

{% block body %}
    <main class="product-detail-container">
        <!-- Back Button -->
        <div class="breadcrumb-nav">
            <a href="/en/products" class="back-link">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                Back to Products
            </a>
        </div>

        <div class="product-card">
            <!-- Product Image -->
            <div class="product-gallery">
                <div class="image-wrapper">
                    <img src="{{ url_for('static', filename='img/p_img/' + p.image_location) }}" alt="{{ p.product_name_en }}" loading="lazy" />
                </div>
            </div>

            <!-- Product Details -->
            <div class="product-details">
                <h1 class="product-title">{{ p.product_name_en }}</h1>
                
                <div class="product-divider"></div>

                <div class="product-description-section">
                    <h2 class="section-subtitle">Product Description</h2>
                    <p class="product-description">
                        {{ p.product_long_description_en }}
                    </p>
                </div>
            </div>
        </div>
    </main>
{% endblock %}
