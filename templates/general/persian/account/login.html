{% extends "general/persian/base.html" %}

{% block title %}ورود به حساب{% endblock %}

{% block head %}
<style>
  .auth-wrap {
    max-width: 420px;
    margin: 40px auto;
    padding: 0 16px;
  }
  .auth-card {
    background: var(--nav-bg, #fff);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 28px 24px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.04);
  }
  .auth-card h1 {
    font-size: 1.35rem;
    margin-bottom: 6px;
    color: var(--site-main-color);
  }
  .auth-card .sub {
    font-size: 0.9rem;
    opacity: 0.75;
    margin-bottom: 22px;
  }
  .form-group { margin-bottom: 14px; }
  .form-group label {
    display: block;
    font-size: 0.85rem;
    margin-bottom: 5px;
    opacity: 0.85;
  }
  .form-group input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border-color);
    background: var(--body-bg-color);
    color: var(--bs-body-color);
  }
  .auth-btn {
    width: 100%;
    margin-top: 8px;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: var(--site-main-color);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
  }
  .auth-btn:hover { opacity: 0.92; }
  .auth-footer {
    text-align: center;
    margin-top: 18px;
    font-size: 0.9rem;
  }
  .auth-footer a { color: var(--site-main-color); text-decoration: none; }
  .auth-msg {
    display: none;
    margin-bottom: 12px;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 0.9rem;
  }
  .auth-msg.error { display: block; background: rgba(239,68,68,0.12); color: #dc2626; }
  .auth-msg.success { display: block; background: rgba(16,185,129,0.12); color: #059669; }
</style>
{% endblock %}

{% block body %}
<main>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>ورود به حساب</h1>
      <p class="sub">برای خرید از فروشگاه وارد شوید</p>
      <div id="msg" class="auth-msg"></div>
      <form id="loginForm">
        <div class="form-group">
          <label>شماره موبایل</label>
          <input type="tel" id="phone" placeholder="09123456789" required autocomplete="username">
        </div>
        <div class="form-group">
          <label>رمز عبور</label>
          <input type="password" id="password" placeholder="******" required autocomplete="current-password">
        </div>
        <button type="submit" class="auth-btn">ورود</button>
      </form>
      <div class="auth-footer">
        حساب ندارید؟ <a href="/account/register">ثبت‌نام</a>
      </div>
    </div>
  </div>
</main>
{% endblock %}

{% block script %}
<script>
document.getElementById("loginForm").addEventListener("submit", function (e) {
  e.preventDefault();
  const msg = document.getElementById("msg");
  msg.className = "auth-msg";
  msg.innerText = "";

  fetch("/account/api/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      phone: document.getElementById("phone").value,
      password: document.getElementById("password").value
    })
  })
  .then(r => r.json().then(d => ({ ok: r.ok, d })))
  .then(({ ok, d }) => {
    if (ok && d.status === "success") {
      msg.className = "auth-msg success";
      msg.innerText = d.message;
      setTimeout(() => { window.location.href = "/account/profile"; }, 600);
    } else {
      msg.className = "auth-msg error";
      msg.innerText = d.message || "خطا در ورود";
    }
  })
  .catch(() => {
    msg.className = "auth-msg error";
    msg.innerText = "خطای ارتباط با سرور";
  });
});
</script>
{% endblock %}
