{% extends "general/persian/base.html" %}

{% block title %}ثبت‌نام{% endblock %}

{% block head %}
<style>
  .auth-wrap { max-width: 460px; margin: 40px auto; padding: 0 16px; }
  .auth-card {
    background: var(--nav-bg, #fff);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 28px 24px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.04);
  }
  .auth-card h1 { font-size: 1.35rem; margin-bottom: 6px; color: var(--site-main-color); }
  .auth-card .sub { font-size: 0.9rem; opacity: 0.75; margin-bottom: 22px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-group { margin-bottom: 14px; }
  .form-group.full { grid-column: 1 / -1; }
  .form-group label { display: block; font-size: 0.85rem; margin-bottom: 5px; opacity: 0.85; }
  .form-group input {
    width: 100%; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--border-color);
    background: var(--body-bg-color); color: var(--bs-body-color);
  }
  .auth-btn {
    width: 100%; margin-top: 8px; padding: 12px; border: none; border-radius: 10px;
    background: var(--site-main-color); color: #fff; font-weight: 600; cursor: pointer;
  }
  .auth-footer { text-align: center; margin-top: 18px; font-size: 0.9rem; }
  .auth-footer a { color: var(--site-main-color); text-decoration: none; }
  .auth-msg { display: none; margin-bottom: 12px; padding: 10px 12px; border-radius: 8px; font-size: 0.9rem; }
  .auth-msg.error { display: block; background: rgba(239,68,68,0.12); color: #dc2626; }
  .auth-msg.success { display: block; background: rgba(16,185,129,0.12); color: #059669; }
  @media (max-width: 480px) { .form-grid { grid-template-columns: 1fr; } }
</style>
{% endblock %}

{% block body %}
<main>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>ثبت‌نام در فروشگاه</h1>
      <p class="sub">برای خرید داخلی حساب کاربری بسازید</p>
      <div id="msg" class="auth-msg"></div>
      <form id="regForm">
        <div class="form-grid">
          <div class="form-group">
            <label>نام</label>
            <input type="text" id="first_name" required>
          </div>
          <div class="form-group">
            <label>نام خانوادگی</label>
            <input type="text" id="last_name" required>
          </div>
          <div class="form-group full">
            <label>شماره موبایل</label>
            <input type="tel" id="phone" placeholder="09123456789" required>
          </div>
          <div class="form-group full">
            <label>ایمیل (اختیاری)</label>
            <input type="email" id="email" placeholder="email@example.com">
          </div>
          <div class="form-group full">
            <label>رمز عبور</label>
            <input type="password" id="password" placeholder="حداقل ۶ کاراکتر" required minlength="6">
          </div>
        </div>
        <button type="submit" class="auth-btn">ثبت‌نام</button>
      </form>
      <div class="auth-footer">
        قبلاً ثبت‌نام کرده‌اید؟ <a href="/account/login">ورود</a>
      </div>
    </div>
  </div>
</main>
{% endblock %}

{% block script %}
<script>
document.getElementById("regForm").addEventListener("submit", function (e) {
  e.preventDefault();
  const msg = document.getElementById("msg");
  msg.className = "auth-msg";

  fetch("/account/api/register", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      first_name: document.getElementById("first_name").value,
      last_name: document.getElementById("last_name").value,
      phone: document.getElementById("phone").value,
      email: document.getElementById("email").value,
      password: document.getElementById("password").value
    })
  })
  .then(r => r.json().then(d => ({ ok: r.ok, d })))
  .then(({ ok, d }) => {
    if (ok && d.status === "success") {
      msg.className = "auth-msg success";
      msg.innerText = d.message;
      setTimeout(() => { window.location.href = "/account/profile"; }, 700);
    } else {
      msg.className = "auth-msg error";
      msg.innerText = d.message || "خطا در ثبت‌نام";
    }
  })
  .catch(() => {
    msg.className = "auth-msg error";
    msg.innerText = "خطای ارتباط با سرور";
  });
});
</script>
{% endblock %}
